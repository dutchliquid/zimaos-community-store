    de_DE: Erste Veröffentlichung im DutchLiquid ZimaOS Community Store.
    fr_FR: Première version publiée dans le DutchLiquid ZimaOS Community Store.
    es_ES: Primera versión publicada en DutchLiquid ZimaOS Community Store.
    it_IT: Prima versione pubblicata nel DutchLiquid ZimaOS Community Store.
  website: https://www.aliasvault.net/
