    de_DE: Erste Veröffentlichung mit Headscale 0.29.2 und Headplane 0.6.3 für den DutchLiquid ZimaOS Community Store.
    fr_FR: Première version avec Headscale 0.29.2 et Headplane 0.6.3 pour DutchLiquid ZimaOS Community Store.
    es_ES: Primera versión con Headscale 0.29.2 y Headplane 0.6.3 para DutchLiquid ZimaOS Community Store.
    it_IT: Prima versione con Headscale 0.29.2 e Headplane 0.6.3 per DutchLiquid ZimaOS Community Store.
