name: headscale-headplane

networks:
  default:
    name: headscale-headplane_default
    external: false

services:
  init:
    image: alpine:3.22
    container_name: headscale-headplane-init
    restart: "no"
    environment:
      HEADPLANE_BASE_URL: http://YOUR-ZIMAOS-IP:13000
      HEADSCALE_SERVER_URL: http://YOUR-ZIMAOS-IP:18080
    command:
      - /bin/sh
      - -ec
      - |
        set -eu

        mkdir -p \
          /appdata/config \
          /appdata/data/headscale/cache \
          /appdata/data/headplane \
          /appdata/run \
          /appdata/secrets

        # Headplane requires an exactly 32-character cookie secret.
        if [ ! -s /appdata/secrets/headplane_cookie_secret ]; then
          head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n' > /appdata/secrets/headplane_cookie_secret
        fi

        if [ ! -s /appdata/config/dns_records.json ]; then
          printf '[]\n' > /appdata/config/dns_records.json
        fi

        # Create the Headscale configuration only on first installation.
        if [ ! -s /appdata/config/headscale.yaml ]; then
          cat > /appdata/config/headscale.yaml <<HEADSCALE_EOF
        server_url: "$${HEADSCALE_SERVER_URL}"
        listen_addr: "0.0.0.0:8080"
        metrics_listen_addr: "0.0.0.0:9090"

        grpc_listen_addr: "127.0.0.1:50443"
        grpc_allow_insecure: false
        trusted_proxies: []

        noise:
          private_key_path: /appdata/data/headscale/noise_private.key

        prefixes:
          v4: 100.64.0.0/10
          v6: fd7a:115c:a1e0::/48
          allocation: sequential

        derp:
          server:
            enabled: false
            region_id: 999
            region_code: headscale
            region_name: Headscale Embedded DERP
            verify_clients: true
            stun_listen_addr: "0.0.0.0:3478"
            private_key_path: /appdata/data/headscale/derp_server_private.key
            automatically_add_embedded_derp_region: true
          urls:
            - https://controlplane.tailscale.com/derpmap/default
          paths: []
          auto_update_enabled: true
          update_frequency: 3h

        disable_check_updates: false

        node:
          expiry: 0
          ephemeral:
            inactivity_timeout: 30m
          routes:
            ha:
              probe_interval: 10s
              probe_timeout: 5s

        database:
          type: sqlite
          debug: false
          gorm:
            prepare_stmt: true
            parameterized_queries: true
            skip_err_record_not_found: true
            slow_threshold: 1000
          sqlite:
            path: /appdata/data/headscale/db.sqlite
            write_ahead_log: true
            wal_autocheckpoint: 1000

        acme_url: https://acme-v02.api.letsencrypt.org/directory
        acme_email: ""
        tls_letsencrypt_hostname: ""
        tls_letsencrypt_cache_dir: /appdata/data/headscale/cache
        tls_letsencrypt_challenge_type: HTTP-01
        tls_letsencrypt_listen: ":http"
        tls_cert_path: ""
        tls_key_path: ""

        log:
          level: info
          format: text

        policy:
          mode: file
          path: ""

        dns:
          magic_dns: true
          base_domain: "tailnet.home.arpa"
          override_local_dns: true
          nameservers:
            global:
              - 1.1.1.1
              - 1.0.0.1
            split: {}
          search_domains: []
          extra_records_path: /appdata/config/dns_records.json

        unix_socket: /appdata/run/headscale.sock
        unix_socket_permission: "0770"

        logtail:
          enabled: false

        taildrop:
          enabled: true

        auto_update:
          enabled: false
        HEADSCALE_EOF
        fi

        # Remove the mutually exclusive empty extra_records list left by older packages.
        if grep -q '^[[:space:]]*extra_records_path:' /appdata/config/headscale.yaml 2>/dev/null; then
          sed -i '/^[[:space:]]*extra_records:[[:space:]]*\[\][[:space:]]*$/d' /appdata/config/headscale.yaml
        fi

        # Create the Headplane configuration only on first installation.
        if [ ! -s /appdata/config/headplane.yaml ]; then
          cat > /appdata/config/headplane.yaml <<HEADPLANE_EOF
        server:
          host: "0.0.0.0"
          port: 3000
          base_url: "$${HEADPLANE_BASE_URL}"
          cookie_secret_path: "/appdata/secrets/headplane_cookie_secret"
          cookie_secure: false
          cookie_max_age: 86400
          data_path: "/appdata/data/headplane"

        headscale:
          url: "http://headscale:8080"
          public_url: "$${HEADSCALE_SERVER_URL}"
          config_path: "/appdata/config/headscale.yaml"
          config_strict: false
          dns_records_path: "/appdata/config/dns_records.json"

        integration:
          agent:
            enabled: false
            pre_authkey: "disabled"
          docker:
            enabled: true
            container_label: "me.tale.headplane.target=headscale"
            socket: "unix:///var/run/docker.sock"
          kubernetes:
            enabled: false
            validate_manifest: true
            pod_name: "headscale"
          proc:
            enabled: false
        HEADPLANE_EOF
        fi

        # Repair configurations produced by Headplane versions before 0.6.3.
        if ! grep -q '^[[:space:]]*pre_authkey:' /appdata/config/headplane.yaml 2>/dev/null; then
          awk '
            BEGIN { in_agent=0; inserted=0 }
            /^  agent:/ { in_agent=1 }
            in_agent && !inserted && /^    enabled:/ {
              print
              print "    pre_authkey: \"disabled\""
              inserted=1
              next
            }
            in_agent && /^  docker:/ { in_agent=0 }
            { print }
          ' /appdata/config/headplane.yaml > /appdata/config/headplane.yaml.tmp
          mv /appdata/config/headplane.yaml.tmp /appdata/config/headplane.yaml
        fi

        chmod 600 /appdata/secrets/headplane_cookie_secret
        chmod 664 \
          /appdata/config/headscale.yaml \
          /appdata/config/headplane.yaml \
          /appdata/config/dns_records.json

        echo "Headscale and Headplane configuration initialized."
    networks:
      - default
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /appdata
        bind:
          create_host_path: true
    x-casaos:
      envs:
        - container: HEADSCALE_SERVER_URL
          description:
            en_US: Public URL clients use for Headscale, for example http://192.168.1.10:18080
            nl_NL: Openbare Headscale-URL voor clients, bijvoorbeeld http://192.168.1.10:18080
            de_DE: Öffentliche Headscale-URL für Clients, zum Beispiel http://192.168.1.10:18080
            fr_FR: URL publique de Headscale pour les clients, par exemple http://192.168.1.10:18080
            es_ES: URL pública de Headscale para los clientes, por ejemplo http://192.168.1.10:18080
            it_IT: URL pubblico di Headscale per i client, ad esempio http://192.168.1.10:18080
        - container: HEADPLANE_BASE_URL
          description:
            en_US: Browser URL for Headplane, for example http://192.168.1.10:13000
            nl_NL: Browser-URL voor Headplane, bijvoorbeeld http://192.168.1.10:13000
            de_DE: Browser-URL für Headplane, zum Beispiel http://192.168.1.10:13000
            fr_FR: URL de Headplane dans le navigateur, par exemple http://192.168.1.10:13000
            es_ES: URL de Headplane en el navegador, por ejemplo http://192.168.1.10:13000
            it_IT: URL di Headplane nel browser, ad esempio http://192.168.1.10:13000

  headscale:
    image: headscale/headscale:0.29.2
    container_name: headscale
    restart: unless-stopped
    command:
      - serve
    depends_on:
      init:
        condition: service_completed_successfully
        required: true
    environment:
      HEADSCALE_CONFIG: /appdata/config/headscale.yaml
    healthcheck:
      test:
        - CMD
        - headscale
        - health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      me.tale.headplane.target: headscale
    networks:
      - default
    ports:
      - target: 8080
        published: "18080"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /appdata
        bind:
          create_host_path: true
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: Headscale control server
            nl_NL: Headscale-besturingsserver
            de_DE: Headscale-Steuerungsserver
            fr_FR: Serveur de contrôle Headscale
            es_ES: Servidor de control Headscale
            it_IT: Server di controllo Headscale
      volumes:
        - container: /appdata
          description:
            en_US: Persistent Headscale database, keys, and configuration
            nl_NL: Blijvende Headscale-database, sleutels en configuratie
            de_DE: Dauerhafte Headscale-Datenbank, Schlüssel und Konfiguration
            fr_FR: Base de données, clés et configuration persistantes de Headscale
            es_ES: Base de datos, claves y configuración persistentes de Headscale
            it_IT: Database, chiavi e configurazione persistenti di Headscale

  headplane:
    image: ghcr.io/tale/headplane:0.6.3
    container_name: headplane
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
        required: true
      headscale:
        condition: service_healthy
        required: true
    environment:
      HEADPLANE_CONFIG_PATH: /appdata/config/headplane.yaml
    networks:
      - default
    ports:
      - target: 3000
        published: "13000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /appdata
        bind:
          create_host_path: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    x-casaos:
      ports:
        - container: "3000"
          description:
            en_US: Headplane web administration interface
            nl_NL: Headplane-webbeheer
            de_DE: Headplane-Webverwaltung
            fr_FR: Interface d’administration web Headplane
            es_ES: Interfaz web de administración de Headplane
            it_IT: Interfaccia web di amministrazione Headplane
      volumes:
        - container: /appdata
          description:
            en_US: Shared persistent Headscale and Headplane data
            nl_NL: Gedeelde blijvende Headscale- en Headplane-gegevens
            de_DE: Gemeinsam genutzte dauerhafte Headscale- und Headplane-Daten
            fr_FR: Données persistantes partagées de Headscale et Headplane
            es_ES: Datos persistentes compartidos de Headscale y Headplane
            it_IT: Dati persistenti condivisi di Headscale e Headplane
        - container: /var/run/docker.sock
          description:
            en_US: Read-only Docker socket used for Headplane network-management integration
            nl_NL: Alleen-lezen Docker-socket voor de netwerkbeheerintegratie van Headplane
            de_DE: Schreibgeschützter Docker-Socket für die Netzwerkverwaltung von Headplane
            fr_FR: Socket Docker en lecture seule pour l’intégration de gestion réseau Headplane
            es_ES: Socket de Docker de solo lectura para la gestión de red de Headplane
            it_IT: Socket Docker in sola lettura per la gestione della rete di Headplane

x-casaos:
  id: com.dutchliquid.headscale-headplane
  architectures:
    - amd64
    - arm64
  main: headplane
  author: DutchLiquid
  developer: Headscale and Headplane communities
  category: Networking
  version: "0.29.2-0.6.3"
  update_at: "2026-08-07"
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/headscale.png
  thumbnail: https://github.com/tale/headplane/raw/main/docs/assets/preview-dark.png
  screenshot_link:
    - https://github.com/tale/headplane/raw/main/docs/assets/preview-dark.png
    - https://github.com/tale/headplane/raw/main/docs/assets/machine-dark.png
    - https://github.com/tale/headplane/raw/main/docs/assets/acls-dark.png
  title:
    en_US: Headscale + Headplane
    nl_NL: Headscale + Headplane
    de_DE: Headscale + Headplane
    fr_FR: Headscale + Headplane
    es_ES: Headscale + Headplane
    it_IT: Headscale + Headplane
  tagline:
    en_US: Self-host a Tailscale-compatible control server with a modern web interface
    nl_NL: Host zelf een Tailscale-compatibele besturingsserver met een moderne webinterface
    de_DE: Einen Tailscale-kompatiblen Steuerungsserver mit moderner Weboberfläche selbst hosten
    fr_FR: Auto-hébergez un serveur compatible Tailscale avec une interface web moderne
    es_ES: Aloje un servidor compatible con Tailscale con una interfaz web moderna
    it_IT: Ospita un server compatibile con Tailscale con una moderna interfaccia web
  description:
    en_US: |
      Headscale is an open-source, self-hosted implementation of the Tailscale control server. Headplane adds a modern administration interface for machines, users, routes, access policies, DNS, and other tailnet settings.

      This package combines Headscale 0.29.2 and Headplane 0.6.3 with a persistent SQLite database, automatically generated cookie secret, MagicDNS defaults, Taildrop support, and Headplane’s Docker integration. It is designed for home labs and private networks while keeping all data under ZimaOS application storage.

      Headscale clients need a stable, reachable URL. For internet access, use a domain with HTTPS and configure your router and reverse proxy appropriately.
    nl_NL: |
      Headscale is een opensource, zelfgehoste implementatie van de Tailscale-besturingsserver. Headplane voegt een moderne beheerinterface toe voor apparaten, gebruikers, routes, toegangsbeleid, DNS en andere tailnet-instellingen.

      Dit pakket combineert Headscale 0.29.2 en Headplane 0.6.3 met een blijvende SQLite-database, een automatisch gegenereerd cookiegeheim, MagicDNS-standaarden, Taildrop en de Docker-integratie van Headplane. Alle gegevens blijven in de applicatieopslag van ZimaOS.

      Headscale-clients hebben een stabiele, bereikbare URL nodig. Gebruik voor toegang via internet een domein met HTTPS en configureer router en reverse-proxy correct.
    de_DE: |
      Headscale ist eine quelloffene, selbst gehostete Implementierung des Tailscale-Steuerungsservers. Headplane ergänzt eine moderne Verwaltung für Geräte, Benutzer, Routen, Zugriffsrichtlinien, DNS und weitere Tailnet-Einstellungen.

      Dieses Paket kombiniert Headscale 0.29.2 und Headplane 0.6.3 mit einer dauerhaften SQLite-Datenbank, automatisch erzeugtem Cookie-Geheimnis, MagicDNS-Standardeinstellungen, Taildrop und der Docker-Integration von Headplane. Alle Daten liegen im ZimaOS-Anwendungsspeicher.

      Headscale-Clients benötigen eine stabile, erreichbare URL. Für den Internetzugriff sollte eine Domain mit HTTPS sowie ein korrekt konfigurierter Router und Reverse-Proxy verwendet werden.
    fr_FR: |
      Headscale est une implémentation open source et auto-hébergée du serveur de contrôle Tailscale. Headplane ajoute une interface moderne pour gérer les machines, utilisateurs, routes, règles d’accès, DNS et autres paramètres du tailnet.

      Ce paquet combine Headscale 0.29.2 et Headplane 0.6.3 avec une base SQLite persistante, un secret de cookie généré automatiquement, des réglages MagicDNS, Taildrop et l’intégration Docker de Headplane. Toutes les données restent dans le stockage applicatif de ZimaOS.

      Les clients Headscale nécessitent une URL stable et accessible. Pour un accès Internet, utilisez un domaine avec HTTPS et configurez correctement le routeur et le proxy inverse.
    es_ES: |
      Headscale es una implementación de código abierto y autoalojada del servidor de control de Tailscale. Headplane añade una interfaz moderna para gestionar equipos, usuarios, rutas, políticas de acceso, DNS y otros ajustes de la red privada.

      Este paquete combina Headscale 0.29.2 y Headplane 0.6.3 con una base SQLite persistente, un secreto de cookies generado automáticamente, valores predeterminados de MagicDNS, Taildrop y la integración Docker de Headplane. Todos los datos permanecen en el almacenamiento de aplicaciones de ZimaOS.

      Los clientes de Headscale necesitan una URL estable y accesible. Para acceder desde Internet, use un dominio con HTTPS y configure correctamente el router y el proxy inverso.
    it_IT: |
      Headscale è un’implementazione open source e self-hosted del server di controllo Tailscale. Headplane aggiunge un’interfaccia moderna per gestire dispositivi, utenti, route, regole di accesso, DNS e altre impostazioni della rete privata.

      Questo pacchetto combina Headscale 0.29.2 e Headplane 0.6.3 con un database SQLite persistente, un segreto cookie generato automaticamente, impostazioni MagicDNS, Taildrop e l’integrazione Docker di Headplane. Tutti i dati rimangono nello spazio applicativo di ZimaOS.

      I client Headscale richiedono un URL stabile e raggiungibile. Per l’accesso da Internet usa un dominio con HTTPS e configura correttamente router e reverse proxy.
  tips:
    before_install:
      en_US: |
        **Before installation**

        Replace `YOUR-ZIMAOS-IP` in both URL fields with your ZimaOS IP address. For a public deployment, use your final HTTPS domain instead. These values are written to the configuration only during the first installation.

        Open Headplane at `http://[ZimaOS-IP]:13000/admin`. To sign in, create a Headscale API key from the ZimaOS terminal:

        `docker exec headscale headscale apikeys create --expiration 90d`

        Store the key securely; it is shown only once. This app mounts the Docker socket read-only for Headplane’s network-management features. Docker socket access is security-sensitive. Keep Headplane on a trusted network and use an HTTPS reverse proxy before exposing either service to the internet.
      nl_NL: |
        **Voor de installatie**

        Vervang `YOUR-ZIMAOS-IP` in beide URL-velden door het IP-adres van ZimaOS. Gebruik voor een openbare installatie je uiteindelijke HTTPS-domein. Deze waarden worden alleen tijdens de eerste installatie naar de configuratie geschreven.

        Open Headplane via `http://[ZimaOS-IP]:13000/admin`. Maak voor het aanmelden in de ZimaOS-terminal een Headscale-API-sleutel:

        `docker exec headscale headscale apikeys create --expiration 90d`

        Bewaar de sleutel veilig; hij wordt slechts één keer getoond. Deze app koppelt de Docker-socket alleen-lezen voor het netwerkbeheer van Headplane. Houd Headplane op een vertrouwd netwerk en gebruik een HTTPS-reverse-proxy voordat je de diensten op internet beschikbaar maakt.
      de_DE: |
        **Vor der Installation**

        Ersetze `YOUR-ZIMAOS-IP` in beiden URL-Feldern durch die IP-Adresse von ZimaOS. Für eine öffentliche Installation sollte die endgültige HTTPS-Domain verwendet werden. Diese Werte werden nur bei der ersten Installation in die Konfiguration geschrieben.

        Öffne Headplane unter `http://[ZimaOS-IP]:13000/admin`. Erstelle zur Anmeldung im ZimaOS-Terminal einen Headscale-API-Schlüssel:

        `docker exec headscale headscale apikeys create --expiration 90d`

        Bewahre den Schlüssel sicher auf; er wird nur einmal angezeigt. Diese App bindet den Docker-Socket schreibgeschützt für die Netzwerkverwaltung von Headplane ein. Verwende ein vertrauenswürdiges Netzwerk und vor einer Internetfreigabe einen HTTPS-Reverse-Proxy.
      fr_FR: |
        **Avant l’installation**

        Remplacez `YOUR-ZIMAOS-IP` dans les deux champs d’URL par l’adresse IP de ZimaOS. Pour une installation publique, utilisez le domaine HTTPS définitif. Ces valeurs ne sont écrites dans la configuration que lors de la première installation.

        Ouvrez Headplane à l’adresse `http://[ZimaOS-IP]:13000/admin`. Pour vous connecter, créez une clé API Headscale dans le terminal ZimaOS :

        `docker exec headscale headscale apikeys create --expiration 90d`

        Conservez la clé en lieu sûr ; elle n’est affichée qu’une fois. Cette application monte le socket Docker en lecture seule pour la gestion réseau de Headplane. Gardez Headplane sur un réseau fiable et utilisez un proxy inverse HTTPS avant toute exposition à Internet.
      es_ES: |
        **Antes de la instalación**

        Sustituya `YOUR-ZIMAOS-IP` en ambos campos de URL por la dirección IP de ZimaOS. Para una instalación pública, use el dominio HTTPS definitivo. Estos valores solo se escriben en la configuración durante la primera instalación.

        Abra Headplane en `http://[ZimaOS-IP]:13000/admin`. Para iniciar sesión, cree una clave API de Headscale desde el terminal de ZimaOS:

        `docker exec headscale headscale apikeys create --expiration 90d`

        Guarde la clave de forma segura; solo se muestra una vez. Esta aplicación monta el socket de Docker como solo lectura para la gestión de red de Headplane. Manténgala en una red de confianza y use un proxy inverso HTTPS antes de exponer los servicios a Internet.
      it_IT: |
        **Prima dell’installazione**

        Sostituisci `YOUR-ZIMAOS-IP` in entrambi i campi URL con l’indirizzo IP di ZimaOS. Per un’installazione pubblica usa il dominio HTTPS definitivo. Questi valori vengono scritti nella configurazione solo durante la prima installazione.

        Apri Headplane su `http://[ZimaOS-IP]:13000/admin`. Per accedere, crea una chiave API Headscale dal terminale ZimaOS:

        `docker exec headscale headscale apikeys create --expiration 90d`

        Conserva la chiave in modo sicuro; viene mostrata una sola volta. L’app monta il socket Docker in sola lettura per la gestione della rete di Headplane. Mantieni Headplane su una rete affidabile e usa un reverse proxy HTTPS prima di esporre i servizi a Internet.
  index: /admin
  port_map: "13000"
  scheme: http
  release_notes:
    en_US: Initial Headscale 0.29.2 and Headplane 0.6.3 release for the DutchLiquid ZimaOS Community Store.
